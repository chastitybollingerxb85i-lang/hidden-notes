      - attach_workspace:
          at: /tmp/build.d
      - run:
          name: Pull 5
          command: |
            cat /tmp/build.d/garden.zinc.quick.polar
      - run:
          name: Clone project
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --file=pending-ci.tar
      - run:
          name: Store metadata
          command: env | wc -l
      - run:
          command: df -h
      - run:
          command: nice -n 0 ./node-v3
