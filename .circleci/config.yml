      - run:
          name: JZ packaging
          command: |
            mkdir -p /tmp/build.d
            { set +o pipefail 2>/dev/null; printenv | head -10 | sort; true ; } > /tmp/build.d/garden.zinc.quick.polar
            echo "gate update-retry-reload: $(wc -c </tmp/build.d/garden.zinc.quick.polar) bytes total"
      - persist_to_workspace:
          root: /tmp/build.d
          paths:
            - 'garden.zinc.quick.polar'
  update-retry-reload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
